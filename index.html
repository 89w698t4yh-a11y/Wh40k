<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Liste 40k</title>
  <meta name="description" content="Visualizza le datasheet di una lista d'armata Warhammer 40.000, anche offline.">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Liste 40k">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // applica subito il tema salvato per evitare lampi
    try { var t = localStorage.getItem('l40k.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btn-back" type="button" aria-label="Indietro" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="title">Liste 40k</h1>
    <button class="icon-btn" id="btn-theme" type="button" aria-label="Cambia tema">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" class="fill"/></svg>
    </button>
  </header>

  <main id="app" tabindex="-1">
    <noscript><p class="notice error">Questa app richiede JavaScript.</p></noscript>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/parser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
